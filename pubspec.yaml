name: Deputado_Transparente
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+6

environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  brasil_fields: ^1.10.0
  chuck_interceptor: ^2.6.2
  cupertino_icons: ^1.0.2
  dio: ^5.8.0+1
  equatable: ^2.0.5
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  flutter_cache_manager: ^3.3.0
  flutter_launcher_icons: ^0.14.3
  flutter_svg: ^2.0.17
  get: ^4.6.5
  google_fonts: ^8.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  modal_bottom_sheet: ^3.0.0
  path_provider: ^2.0.12
  transparent_image: ^2.0.0
  pdfx: ^2.8.0
  pretty_dio_logger: ^1.4.0
  webview_flutter: ^4.0.2
  url_launcher: ^6.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mocktail: ^1.0.4

flutter_icons:
  android: true
  ios: true
  image_path: "lib/ui/assets/logo/app_logo.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/ui/assets/states/
